<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePulse - Aktien & Trading Dashboard</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --green: #22c55e;
      --red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: var(--accent-blue);
    }

    .price-up { color: var(--green); font-weight: bold; }
    .price-down { color: var(--red); font-weight: bold; }

    .stock-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #21262d;
    }

    .stock-item:last-child { border-bottom: none; }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-buy { background: var(--green); color: white; }
    .btn-sell { background: var(--red); color: white; }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: #0d1117;
      color: white;
    }

    canvas {
      width: 100%;
      height: 200px;
      background: #0d1117;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ TradePulse</div>
    <div class="nav-links">
      <button class="nav-btn">Dashboard</button>
      <button class="nav-btn">Watchlist</button>
      <button class="nav-btn">Simulator</button>
      <button class="nav-btn">Rechner</button>
    </div>
  </header>

  <main>
    <div class="grid-layout">
      <!-- Live Market Overview -->
      <div class="card">
        <h2>🔥 Top Märkte</h2>
        <div class="stock-item">
          <span>Apple (AAPL)</span>
          <span class="price-up">$185.40 (+1.8%)</span>
        </div>
        <div class="stock-item">
          <span>Tesla (TSLA)</span>
          <span class="price-down">$238.10 (-2.4%)</span>
        </div>
        <div class="stock-item">
          <span>Bitcoin (BTC)</span>
          <span class="price-up">$64,200 (+3.5%)</span>
        </div>
        <div class="stock-item">
          <span>NVIDIA (NVDA)</span>
          <span class="price-up">$122.50 (+4.1%)</span>
        </div>
      </div>

      <!-- Main Chart Widget -->
      <div class="card">
        <h2>📈 Live Chart (AAPL)</h2>
        <canvas id="stockChart"></canvas>
      </div>

      <!-- Trading Simulator -->
      <div class="card">
        <h2>🎮 Trade Simulator</h2>
        <p style="color: var(--text-muted);">Guthaben: <strong style="color: white;">10.000 €</strong></p>
        <label style="font-size: 12px; margin-top: 10px; display: block; color: var(--text-muted);">Anzahl Aktien</label>
        <input type="number" value="1" min="1">
        <button class="btn btn-buy">Buy (Kaufen)</button>
        <button class="btn btn-sell">Sell (Verkaufen)</button>
      </div>
    </div>

    <!-- Zinseszins-Rechner -->
    <div class="card" style="max-width: 600px;">
      <h2>🧮 Zinseszins-Rechner</h2>
      <label style="color: var(--text-muted); font-size: 14px;">Startkapital (€)</label>
      <input type="number" id="capital" value="1000">
      
      <label style="color: var(--text-muted); font-size: 14px; margin-top: 10px; display: block;">Rendite pro Jahr (%)</label>
      <input type="number" id="rate" value="7">

      <label style="color: var(--text-muted); font-size: 14px; margin-top: 10px; display: block;">Laufzeit (Jahre)</label>
      <input type="number" id="years" value="10">

      <button class="btn" style="background: var(--accent-blue); color: #000;" onclick="calculate()">Berechnen</button>
      <p id="result" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
  </main>

  <script>
    // Simple Chart Visualizer
    const canvas = document.getElementById('stockChart');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    ctx.beginPath();
    ctx.moveTo(10, 150);
    ctx.lineTo(80, 120);
    ctx.lineTo(150, 140);
    ctx.lineTo(220, 70);
    ctx.lineTo(290, 90);
    ctx.lineTo(360, 30);
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Rechner-Logik
    function calculate() {
      const p = parseFloat(document.getElementById('capital').value);
      const r = parseFloat(document.getElementById('rate').value) / 100;
      const t = parseFloat(document.getElementById('years').value);

      const total = p * Math.pow((1 + r), t);
      document.getElementById('result').innerText = 'Endkapital: ' + total.toFixed(2) + ' €';
    }
  </script>
</body>
</html>
